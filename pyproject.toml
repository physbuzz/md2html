[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2html"
dynamic = ["version"]
description = "Markdown notes, executable snippets, and math for HTML pages and static sites."
readme = "readme.md"
requires-python = ">=3.10"
dependencies = ["Markdown>=3.10,<4", "pymdown-extensions>=10.21,<11", "python-liquid>=2.3,<3", "PyYAML>=6", "Pygments>=2.19", "pygments-mathematica>=0.4.2,<0.5", "latex2mathml>=3.81", "ziamath>=0.13", "watchdog>=4", "psutil>=5.9", "rcssmin>=1.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "beautifulsoup4>=4", "ruff"]
build = ["pyinstaller>=6"]

[tool.uv]
required-version = "==0.13.1"
build-constraint-dependencies = ["setuptools==84.0.0", "wheel==0.48.0"]

[project.scripts]
md2html = "md2html.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "md2html.__version__"}

[tool.setuptools.package-data]
md2html = ["assets/*.css", "assets/*.js", "default_templates/*.html", "scripts/*.mjs", "scripts/*.rb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:path is deprecated.*:DeprecationWarning:ziamath.*"]

[tool.setuptools.data-files]
"share/md2html" = ["readme.md"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
