name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # Action runtimes are separate from the build's .node-version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install build tools
        run: |
          pipx install uv==0.13.1
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y racket ruby
      - name: Install optional Rouge backend for tests
        run: |
          # Isolate gems for this step and persist the paths for later tests.
          export GEM_HOME="$RUNNER_TEMP/md2html-gems"
          export GEM_PATH="$GEM_HOME"
          echo "GEM_HOME=$GEM_HOME" >> "$GITHUB_ENV"
          echo "GEM_PATH=$GEM_PATH" >> "$GITHUB_ENV"
          gem install rouge --version 4.7.0 --no-document
          ruby -rrouge -e 'puts "Testing with Rouge #{Rouge.version}"; abort "Missing GitHub themes" unless %w[github.light github.dark].all? { |name| Rouge::Theme.find(name) }'
      - name: Install locked Python dependencies
        run: make sync
      - name: Validate version tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          .venv/bin/python - <<'PY'
          import os
          from md2html import __version__
          from md2html.update import version_tuple
          version_tuple(__version__)
          if os.environ['EVENT_NAME'] == 'push':
              assert os.environ['TAG_NAME'] == 'v' + __version__, 'Tag must match md2html.__version__'
          PY
      - name: Build executable without root privileges
        run: make pyinstaller
      - name: Test source
        run: |
          .venv/bin/ruff check src tests
          make test
      - name: Test packaged executable
        run: make test-packaged
      - name: Test Markdown widgets in browsers
        run: |
          npx playwright install --with-deps chromium firefox
          make test-browser MD2HTML="$PWD/dist/md2html"
      - name: Prepare checksummed release assets
        run: |
          version="$(.venv/bin/python -c 'from md2html import __version__; print(__version__)')"
          test "$(dist/md2html --version)" = "md2html $version"
          mkdir release
          cp dist/md2html "release/md2html-$version-linux-x86_64"
          cd release
          sha256sum md2html-* > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-x86_64
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.repository == 'physbuzz/md2html'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-x86_64
          path: release
      - name: Verify transferred assets
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish only after all assets have uploaded
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" release/* --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "$TAG_NAME" --generate-notes --draft
          gh release edit "$TAG_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
